<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>YouTube 批量下載器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div id="status" class="status" role="status">連線狀態讀取中…</div>
    <div class="row">
      <button id="deploy" type="button">下載部署</button>
      <button id="start" type="button">啟動</button>
    </div>
    <div id="note" class="note" hidden></div>
  </header>

  <main>
    <label for="urls">網址（可貼多行、播放清單或頻道網址）</label>
    <textarea id="urls" rows="4" placeholder="https://www.youtube.com/watch?v=…"></textarea>
    <ul id="invalid" class="invalid" hidden></ul>

    <div class="row">
      <label>解析度
        <select id="quality">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
        </select>
      </label>
      <label>最多下載
        <input id="limit" type="number" min="1" max="1000" placeholder="全部">
        支
      </label>
    </div>

    <label for="filename">檔名（單支影片時可修改，預設為影片標題）</label>
    <input id="filename" type="text" disabled placeholder="影片標題">

    <div class="row">
      <button id="download" type="button" disabled>下載</button>
      <button id="cancel" type="button" hidden>取消</button>
    </div>

    <ul id="items" class="items"></ul>
    <div id="summary" class="summary" hidden></div>
  </main>

  <footer>
    <label for="outdir">存放資料夾</label>
    <div class="row">
      <input id="outdir" type="text" disabled>
      <button id="save-outdir" type="button" disabled>儲存</button>
    </div>
    <button id="update" type="button" class="link" disabled>更新下載引擎</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
