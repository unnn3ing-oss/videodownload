<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube 批量下載器</title>
  <link rel="stylesheet" href="lib/queue-view.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <path d="M16 7v11m0 0-5-5m5 5 5-5M9 23h14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <div class="title-row">
            <h1>YouTube 批量下載器</h1>
            <button id="update-badge" class="badge" type="button" hidden>有新版本</button>
          </div>
          <p id="engine-info" class="engine-info">本機下載引擎未連線</p>
        </div>
      </div>
      <div id="status" class="pill" data-state="stopped" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="status-text">尚未啟動</span>
      </div>
    </header>

    <div id="note" class="note" role="status" aria-live="polite" hidden></div>
    <div id="host-note" class="note" data-kind="error" role="status" aria-live="polite" hidden></div>

    <section id="setup" class="card setup" hidden>
      <h2>開始使用</h2>
      <p id="setup-hint" class="setup-hint"></p>
      <ol class="steps">
        <li class="step">
          <span class="num">1</span>
          <div class="step-body"><strong>下載部署</strong><span>只需要做一次：下載安裝檔並執行</span></div>
          <button id="deploy" class="btn" type="button">下載部署</button>
        </li>
        <li class="step">
          <span class="num">2</span>
          <div class="step-body"><strong>啟動</strong><span>安裝完成後，連線到本機小程式</span></div>
          <button id="start" class="btn" type="button">啟動</button>
        </li>
      </ol>
    </section>

    <section id="tab-card" class="card tab" hidden>
      <span id="tab-kind" class="chip">影片</span>
      <div class="tab-text">
        <span class="tab-label">目前分頁</span>
        <span id="tab-title" class="tab-title"></span>
      </div>
      <button id="tab-add" class="btn small" type="button">加入</button>
    </section>

    <section class="card add">
      <div class="add-row">
        <input id="add-url" type="text" placeholder="貼上 YouTube 網址，按 Enter 或「增加」" spellcheck="false" autocomplete="off" aria-label="影片網址">
        <button id="add-btn" class="btn primary" type="button">增加</button>
      </div>
      <p id="add-note" class="add-note" role="status" aria-live="polite" hidden></p>
    </section>

    <section class="card queue">
      <div class="queue-head">
        <h2>下載清單</h2>
        <span id="queue-stats" class="count"></span>
        <span id="cooldown-chip" class="cool-chip" hidden></span>
      </div>
      <ul id="queue-list" class="qlist"></ul>
      <p id="queue-empty" class="queue-empty">清單是空的。貼上網址按「增加」，影片的標題和封面會自動帶進來。</p>
      <div class="queue-set">
        <div class="field">
          <span id="quality-label" class="field-label">解析度</span>
          <div id="quality" class="segmented" role="radiogroup" aria-labelledby="quality-label">
            <label><input type="radio" name="quality" value="1080" checked><span>1080p</span></label>
            <label><input type="radio" name="quality" value="720"><span>720p</span></label>
          </div>
        </div>
        <div class="field">
          <label for="cooldown" class="field-label">每支間隔</label>
          <div class="suffix">
            <input id="cooldown" type="number" min="3" max="60" step="1" value="10" inputmode="numeric">
            <span>秒</span>
          </div>
        </div>
      </div>
      <button id="start-all" class="btn primary block" type="button" disabled>開始全部下載</button>
    </section>

    <details id="settings" class="card settings">
      <summary>設定與工具</summary>
      <div class="settings-body">
        <div class="field">
          <label for="outdir" class="field-label">存放資料夾</label>
          <div class="row">
            <input id="outdir" type="text" disabled spellcheck="false">
            <button id="save-outdir" class="btn small" type="button" disabled>儲存</button>
          </div>
        </div>
        <div class="field">
          <label for="limit" class="field-label">頻道或播放清單最多展開</label>
          <div class="suffix">
            <input id="limit" type="number" min="1" max="1000" step="1" value="50" inputmode="numeric">
            <span>支</span>
          </div>
        </div>
        <label class="check"><input id="auto-cover" type="checkbox" checked><span>下載完影片後，自動下載封面</span></label>
        <div class="row between"><span>下載引擎（yt-dlp）</span><button id="update" class="btn small" type="button" disabled>更新下載引擎</button></div>
        <div class="row between"><span>本機小程式</span><button id="redeploy" class="btn small ghost" type="button">重新下載安裝檔</button></div>
        <section class="update" aria-labelledby="update-title">
          <div class="row between">
            <h2 id="update-title" class="update-title">版本與更新</h2>
            <button id="update-check" class="btn small ghost" type="button">檢查更新</button>
          </div>
          <dl class="versions">
            <dt>目前版本</dt><dd id="ver-current" class="mono"></dd>
            <dt>最新版本</dt><dd id="ver-latest">尚未檢查</dd>
          </dl>
          <p id="update-note" class="update-note" hidden></p>
          <button id="update-apply" class="btn primary block" type="button" disabled>更新到最新版</button>
          <p id="update-progress" class="update-progress" role="status" aria-live="polite" hidden></p>
        </section>
      </div>
    </details>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
