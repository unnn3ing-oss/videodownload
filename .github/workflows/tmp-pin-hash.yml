name: tmp-pin-hash
on:
  push:
    paths: [".github/workflows/tmp-pin-hash.yml"]
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o py.zip https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip
          sha256sum py.zip
          curl -fsSL https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip.sigstore -o /dev/null -w "sigstore %{http_code}\n" || true
